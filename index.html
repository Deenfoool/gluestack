<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#303030" />
  <title>gluestack — GLB Model Editor</title>
  <link rel="stylesheet" href="./styles.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="app-shell">
    <header class="main-menu-bar">
      <div class="app-mark">gluestack</div>
      <details class="menu" id="file-menu">
        <summary>File</summary>
        <div class="menu-popover">
          <button type="button" data-action="new">New</button>
          <button type="button" data-action="import">Import GLB/GLTF…</button>
          <div class="menu-separator"></div>
          <button type="button" data-action="export">Export GLB…</button>
        </div>
      </details>
      <button type="button" class="menu-button" disabled>Edit</button>
      <details class="menu" id="add-menu">
        <summary>Add</summary>
        <div class="menu-popover">
          <button type="button" data-primitive="cube">Mesh › Cube</button>
          <button type="button" data-primitive="sphere">Mesh › UV Sphere</button>
          <button type="button" data-primitive="cylinder">Mesh › Cylinder</button>
          <button type="button" data-primitive="cone">Mesh › Cone</button>
          <button type="button" data-primitive="plane">Mesh › Plane</button>
          <button type="button" data-primitive="torus">Mesh › Torus</button>
        </div>
      </details>
      <button type="button" class="menu-button" disabled>Object</button>
      <div class="main-menu-spacer"></div>
      <span class="build-label">Object Mode · v0.1</span>
    </header>

    <nav class="workspace-tabs" aria-label="Workspaces">
      <button type="button" class="workspace-tab active">Layout</button>
      <button type="button" class="workspace-tab">Modeling</button>
      <button type="button" class="workspace-tab" disabled title="По roadmap">UV Editing</button>
      <button type="button" class="workspace-tab" disabled title="По roadmap">Shading</button>
      <div class="workspace-spacer"></div>
      <button type="button" class="viewport-command" data-view="frame">Frame Selected</button>
    </nav>

    <main class="workspace">
      <aside class="toolbar" aria-label="Toolbar">
        <button type="button" class="tool-button active" data-transform-mode="translate" title="Move (G)">↔</button>
        <button type="button" class="tool-button" data-transform-mode="rotate" title="Rotate (R)">⟳</button>
        <button type="button" class="tool-button" data-transform-mode="scale" title="Scale (S)">◇</button>
        <div class="toolbar-separator"></div>
        <button type="button" class="tool-button" data-action="delete" title="Delete (X)">×</button>
      </aside>

      <section class="viewport-panel">
        <div class="viewport-header">
          <div class="mode-chip">Object Mode</div>
          <span class="viewport-hint">MMB orbit · Shift+MMB pan · Wheel zoom</span>
          <div class="viewport-header-spacer"></div>
          <button type="button" class="header-icon active" title="Solid">●</button>
          <button type="button" class="header-icon" disabled title="Material Preview — по roadmap">◐</button>
        </div>
        <div id="viewport" class="viewport"></div>
      </section>

      <aside class="right-column">
        <section class="panel outliner-panel">
          <div class="panel-header">Scene Collection</div>
          <div id="outliner" class="outliner" aria-label="Outliner"></div>
        </section>

        <section class="panel properties-panel">
          <div class="properties-tabs" aria-label="Properties tabs">
            <button type="button" class="property-tab active" title="Object">□</button>
            <button type="button" class="property-tab" disabled title="Modifiers — по roadmap">⌘</button>
            <button type="button" class="property-tab" disabled title="Material — по roadmap">●</button>
          </div>
          <div class="properties-content">
            <div id="empty-properties" class="empty-properties">Выберите объект</div>
            <div id="object-properties" hidden>
              <label class="name-field-label">
                <span>Name</span>
                <input id="object-name" type="text" autocomplete="off" />
              </label>

              <div class="property-section">
                <div class="section-title">Transform</div>
                <div class="transform-grid">
                  <span>Location</span>
                  <label>X <input data-transform="position.x" type="number" step="0.01" /></label>
                  <label>Y <input data-transform="position.y" type="number" step="0.01" /></label>
                  <label>Z <input data-transform="position.z" type="number" step="0.01" /></label>

                  <span>Rotation</span>
                  <label>X <input data-transform="rotation.x" data-angle="true" type="number" step="1" /></label>
                  <label>Y <input data-transform="rotation.y" data-angle="true" type="number" step="1" /></label>
                  <label>Z <input data-transform="rotation.z" data-angle="true" type="number" step="1" /></label>

                  <span>Scale</span>
                  <label>X <input data-transform="scale.x" type="number" step="0.01" /></label>
                  <label>Y <input data-transform="scale.y" type="number" step="0.01" /></label>
                  <label>Z <input data-transform="scale.z" type="number" step="0.01" /></label>
                </div>
              </div>
            </div>
          </div>
        </section>
      </aside>
    </main>

    <footer class="status-bar">
      <span id="status-message">Готово</span>
      <div class="status-spacer"></div>
      <span id="scene-stats">Objects 0 · Vertices 0 · Triangles 0</span>
    </footer>
  </div>

  <input id="file-input" type="file" accept=".glb,.gltf,model/gltf-binary,model/gltf+json" hidden />

  <script type="module" src="./src/main.js"></script>
</body>
</html>
